# Frontend CI workflow
name: Frontend CI
on:
  push:
    paths:
      - 'client/**'
  pull_request:
    paths:
      - 'client/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./client
        run: npm install
      - name: Lint
        working-directory: ./client
        run: npm run lint
      - name: Type check
        working-directory: ./client
        run: npm run typecheck
      - name: Build
        working-directory: ./client
        run: npm run build
