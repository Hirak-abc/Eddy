name: Bug Report
description: Create a report to help us improve Eddy
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Frontend (Owner UI)
        - Frontend (Customer UI)
        - Backend API / Server
        - Convex Database
        - Integrations (Clerk / xAI / Meta / Razorpay / R2)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen vs what actually happened?
    validations:
      required: true
