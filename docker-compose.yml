# Eddy — local dev via Docker (fixes "works on my machine" dependency conflicts)
#
# Secrets are NEVER baked into images and NEVER committed:
#   - server/.env, client/.env.local, .env are git-ignored (see .gitignore)
#   - server runtime config comes from `env_file: ./server/.env` below
#   - client Vite vars come from Compose `environment:` (VITE_*), not from files
#
# Usage (colleague only needs Docker Desktop, no matching Node/npm install):
#   1. cp .env.example server/.env   (then fill in real secrets locally — do NOT commit)
#   2. docker compose --env-file server/.env up --build
#   3. open http://localhost:5173 (client) and http://localhost:5000/health (server)

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
      - ./server/.env.meta.local
    environment:
      - NODE_ENV=development
      - PORT=5001
      - CLIENT_URL=http://localhost:5173
    volumes:
      # Live reload source without overwriting container node_modules
      # (this is what avoids host dependency conflicts)
      - ./server/src:/app/server/src
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      # Browser calls the server directly (bypasses Vite proxy, which points
      # at localhost and would fail from inside the container).
      # Server uses open cors() in server/src/app.ts, so this works.
      - VITE_API_URL=http://localhost:5001/api
      # Map only Clerk's public publishable key; keep server secrets server-side.
      - VITE_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      - VITE_GA_MEASUREMENT_ID=${VITE_GA_MEASUREMENT_ID:-}
    volumes:
      - ./client/src:/app/client/src
      - ./client/index.html:/app/client/index.html
    restart: unless-stopped
